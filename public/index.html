<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMI — Citizen Mobility Intelligence</title>

    <!-- ============================================================
         CMI Landing Page Shell
         
         This is the STRUCTURAL SKELETON only. Custom UI/UX design
         components, brand styling, and advanced map overlays will be
         injected in a later phase. The JavaScript fetch scaffold
         is fully wired to the /api/route/analyze backend endpoint.
         
         Map Stack:
           • Leaflet.js   — lightweight 2D map tiles + markers
           • OpenStreetMap — free tile provider
           • Cesium.js     — 3D globe (placeholder, load later)
         ============================================================ -->

    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <style>
        /* ── Reset & Base ──────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: #0f1117;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ────────────────────────────────────────────── */
        .cmi-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 1rem 2rem;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .cmi-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cmi-header .badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: #7c3aed33;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── Main Layout ───────────────────────────────────────── */
        .cmi-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Sidebar (Route Input Panel) ───────────────────────── */
        .cmi-sidebar {
            width: 380px;
            min-width: 320px;
            background: #1a1a2e;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-right: 1px solid #2d2d44;
            overflow-y: auto;
        }

        .cmi-sidebar h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .input-group label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 500;
        }
        .input-group input {
            padding: 0.65rem 0.8rem;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px #60a5fa22;
        }

        .btn-analyze {
            padding: 0.75rem 1.2rem;
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        .btn-analyze:hover { opacity: 0.9; }
        .btn-analyze:active { transform: scale(0.98); }
        .btn-analyze:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Status / Loading ──────────────────────────────────── */
        .status-bar {
            font-size: 0.8rem;
            color: #64748b;
            min-height: 1.2rem;
        }
        .status-bar.error { color: #f87171; }
        .status-bar.success { color: #4ade80; }

        /* ── Summary Panel ─────────────────────────────────────── */
        .summary-panel {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #cbd5e1;
            display: none;
        }
        .summary-panel.visible { display: block; }
        .summary-panel h3 {
            font-size: 0.75rem;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        /* ── Alerts List ───────────────────────────────────────── */
        .alerts-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
        }
        .alert-card {
            background: #1e293b;
            border-left: 3px solid #f59e0b;
            border-radius: 4px;
            padding: 0.6rem 0.8rem;
            font-size: 0.8rem;
        }
        .alert-card.severity-low    { border-left-color: #4ade80; }
        .alert-card.severity-medium  { border-left-color: #f59e0b; }
        .alert-card.severity-high    { border-left-color: #f87171; }
        .alert-card.severity-critical { border-left-color: #dc2626; }
        .alert-card strong { color: #e2e8f0; }
        .alert-card p { color: #94a3b8; margin-top: 0.25rem; }

        /* ── Map Container ─────────────────────────────────────── */
        .cmi-map-container {
            flex: 1;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* ── Provider Badge ────────────────────────────────────── */
        .provider-badge {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            z-index: 1000;
            background: #1a1a2ecc;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #64748b;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="cmi-header">
        <h1>🛣️ Citizen Mobility Intelligence</h1>
        <span class="badge">Chennai Beta</span>
    </header>

    <!-- ── Main Layout ─────────────────────────────────────────── -->
    <main class="cmi-main">

        <!-- ── Sidebar: Route Input ────────────────────────────── -->
        <aside class="cmi-sidebar">
            <h2>Route Analyzer</h2>

            <div class="input-group">
                <label for="origin">Origin Location</label>
                <input type="text" id="origin"
                       placeholder="e.g., Chennai Central"
                       value="Chennai Central" />
            </div>

            <div class="input-group">
                <label for="destination">Destination Location</label>
                <input type="text" id="destination"
                       placeholder="e.g., Chennai Airport"
                       value="Chennai Airport" />
            </div>

            <button class="btn-analyze" id="btn-analyze"
                    onclick="analyzeRoute()">
                ⚡ Analyze Route
            </button>

            <div class="status-bar" id="status"></div>

            <!-- AI Summary (shown after analysis) -->
            <div class="summary-panel" id="summary-panel">
                <h3>🤖 AI Corridor Summary</h3>
                <p id="summary-text"></p>
            </div>

            <!-- Alert Cards (shown after analysis) -->
            <div class="alerts-list" id="alerts-list"></div>
        </aside>

        <!-- ── Map Canvas ──────────────────────────────────────── -->
        <section class="cmi-map-container">
            <div id="map"></div>
            <div class="provider-badge" id="provider-badge">
                LLM: waiting...
            </div>
        </section>

    </main>

    <!-- ── Leaflet.js ──────────────────────────────────────────── -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- ── Cesium.js Placeholder (uncomment when ready) ────────
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    ──────────────────────────────────────────────────────────── -->

    <script>
    // ============================================================
    // CMI Frontend Controller
    //
    // This is the STRUCTURAL SCAFFOLD for the map interface.
    // Custom markers, route renderers, and UI components will be
    // injected later without modifying this core fetch logic.
    // ============================================================

    // ── Map Initialization ─────────────────────────────────────
    // Default center: Chennai, India
    const map = L.map('map').setView([13.0827, 80.2707], 12);

    // OpenStreetMap tile layer (swap for Mapbox/Google tiles later)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
    }).addTo(map);

    // Layer group for dynamic markers (cleared on each new analysis)
    const markersLayer = L.layerGroup().addTo(map);

    // ── Severity → Marker Color Mapping ────────────────────────
    const MARKER_COLORS = {
        green:    '#4ade80',
        orange:   '#f59e0b',
        red:      '#f87171',
        darkred:  '#dc2626',
    };

    function createCircleMarker(alert) {
        const color = MARKER_COLORS[alert.marker_color] || '#f59e0b';
        return L.circleMarker([alert.lat, alert.lng], {
            radius: 10,
            fillColor: color,
            color: '#fff',
            weight: 2,
            opacity: 0.9,
            fillOpacity: 0.7,
        }).bindPopup(`
            <strong>${alert.headline}</strong><br/>
            <em>${alert.severity.toUpperCase()} — ${alert.category}</em><br/>
            <p style="margin-top:4px;font-size:0.85em">${alert.description}</p>
        `);
    }

    // ── Core Fetch Scaffold ────────────────────────────────────
    // This is the single integration point between the frontend
    // and the /api/route/analyze backend endpoint. Swap in custom
    // map rendering, marker icons, and animations here.

    async function analyzeRoute() {
        const originEl = document.getElementById('origin');
        const destEl = document.getElementById('destination');
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('btn-analyze');
        const summaryPanel = document.getElementById('summary-panel');
        const summaryText = document.getElementById('summary-text');
        const alertsList = document.getElementById('alerts-list');
        const providerBadge = document.getElementById('provider-badge');

        const origin = originEl.value.trim();
        const destination = destEl.value.trim();

        // ── Input validation ───────────────────────────────────
        if (!origin || !destination) {
            statusEl.textContent = '⚠️ Please enter both origin and destination.';
            statusEl.className = 'status-bar error';
            return;
        }

        // ── UI: Loading state ──────────────────────────────────
        btnEl.disabled = true;
        statusEl.textContent = '🔄 Analyzing corridor...';
        statusEl.className = 'status-bar';
        summaryPanel.classList.remove('visible');
        alertsList.innerHTML = '';
        markersLayer.clearLayers();

        try {
            // ── API Call ────────────────────────────────────────
            const response = await fetch('/api/route/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ origin, destination }),
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.detail || `HTTP ${response.status}`);
            }

            const data = await response.json();

            // ── Render: AI Summary ──────────────────────────────
            summaryText.textContent = data.summary;
            summaryPanel.classList.add('visible');
            providerBadge.textContent = `LLM: ${data.provider}`;

            // ── Render: Alert Markers on Map ────────────────────
            const bounds = [];
            data.alerts.forEach(alert => {
                const marker = createCircleMarker(alert);
                markersLayer.addLayer(marker);
                bounds.push([alert.lat, alert.lng]);

                // ── Render: Alert Cards in Sidebar ──────────────
                const card = document.createElement('div');
                card.className = `alert-card severity-${alert.severity}`;
                card.innerHTML = `
                    <strong>${alert.headline}</strong>
                    <p>${alert.description}</p>
                `;
                alertsList.appendChild(card);
            });

            // ── Fit map to show all markers ─────────────────────
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            // ── Render: Bounding Box (optional debug overlay) ───
            if (data.bounding_box) {
                const bb = data.bounding_box;
                L.rectangle(
                    [[bb.south, bb.west], [bb.north, bb.east]],
                    { color: '#60a5fa', weight: 1, fillOpacity: 0.05 }
                ).addTo(markersLayer);
            }

            statusEl.textContent = `✅ Analysis complete — ${data.alerts.length} alerts found.`;
            statusEl.className = 'status-bar success';

        } catch (err) {
            console.error('CMI analysis error:', err);
            statusEl.textContent = `❌ ${err.message}`;
            statusEl.className = 'status-bar error';
        } finally {
            btnEl.disabled = false;
        }
    }

    // ── Keyboard shortcut: Enter to analyze ────────────────────
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !document.getElementById('btn-analyze').disabled) {
            analyzeRoute();
        }
    });
    </script>

</body>
</html>
